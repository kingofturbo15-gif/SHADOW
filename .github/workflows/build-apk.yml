
name: Build SHADOW APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
            packages: tools

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract SHADOW project
        run: unzip -o SHADOW-Android-Source.zip -d .

      - name: Build APK
        run: gradle -p SHADOW-Android assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SHADOW-APK
          path: SHADOW-Android/app/build/outputs/apk/debug/app-debug.apk
          
